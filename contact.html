    </header>
    <main class="content" id="contacter">
        <h1>Nous contacter</h1>
        <p>Une question ou une idée ? Contactez-nous en remplissant le formulaire :</p>
        <form action="" method="post">
            <div class="infos-form">
                <label for="nom">Nom :</label>
                <input type="text" id="nom" name="nom" placeholder="Votre nom" required>

                <label for="prenom">Prénom :</label>
                <input type="text" id="prenom" name="prenom" placeholder="Votre prénom" required>
            </div>

            <label for="email">Adresse e-mail :</label>
            <input type="email" id="email" name="email" placeholder="exemple@email.com"
                pattern="^[^\s@]+@[^\s@]+\.[^\s@]+$" required>

            <label for="objet">Objet du message :</label>
            <input type="text" id="objet" name="objet" placeholder="L'objet de votre message" required>

            <label for="message">Message :</label>
            <textarea id="message" name="message" rows="5" cols="5" placeholder="Écrivez votre message ici..."
                required></textarea>

            <button type="submit">Envoyer le message</button>
        </form>
    </main>
    <footer>
        <p>© 2026 Les femmes et l'informatique</p>
